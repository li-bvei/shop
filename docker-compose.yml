services:
  # Dedicated MySQL 8.0 container rather than a host-managed instance —
  # 宝塔's own bundled MySQL was found to be 5.5 in practice, which Django
  # 4.2 refuses to run against (requires 8.0+). Fully isolated from
  # whatever else the host's MySQL serves.
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./store-admin-backend
    restart: unless-stopped
    env_file:
      - ./store-admin-backend/.env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles:ro

  frontend:
    build: ./store-admin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host-side port. Either point 宝塔's own Nginx (domain + SSL) at this
      # as a reverse proxy target, or hit it directly at
      # http://<server-ip>:<this-port> if there's no domain yet. Change the
      # left-hand side if this port is already taken on the host.
      - "8082:80"
    volumes:
      # Django admin's own CSS/JS (collected at backend image build time) —
      # this container's nginx serves them directly under /static/ instead
      # of proxying every asset request through gunicorn.
      - static_volume:/usr/share/nginx/html/static:ro

volumes:
  static_volume:
  mysql_data:
