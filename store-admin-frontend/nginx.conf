server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed build assets — safe to cache forever. A request for a
    # hash that no longer exists (a browser running a stale index.html after
    # a deploy) must 404, NOT fall through to index.html — otherwise the
    # browser's dynamic import() receives HTML and throws a confusing
    # "failed to load module" instead of a clean, retryable 404.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Vue Router history mode — any path that isn't a real static file
    # falls back to index.html so client-side routing can take over.
    # index.html itself must never be cached hard: it's the pointer to the
    # current asset hashes, so a stale copy breaks the app after every
    # deploy. `no-cache` = the browser may store it but must revalidate
    # (cheap 304 when unchanged).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxied to the backend container over the internal Docker network —
    # the browser only ever talks to this one origin, so no CORS
    # preflight is needed for normal traffic (django-cors-headers still
    # needs CORS_ALLOWED_ORIGINS set to the real public domain, since that's
    # the Origin the browser reports).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin — not part of the app's normal login flow (that goes
    # through /api/), but proxied through so it's at least reachable for
    # occasional direct DB fixes.
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin's own CSS/JS, collected into the shared static_volume at
    # backend image build time (see docker-compose.yml) — served directly
    # by this container's nginx rather than proxied through gunicorn.
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
    }
}
