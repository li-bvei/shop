<!doctype html>
<html lang="ja" manifest="checkin-display.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<title>チェックイン表示</title>
<style>
  /* Deliberately plain CSS — this page has to run on an iOS 9 iPad. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #ffffff; color: #14181c;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }

  .screen { display: none; width: 100%; height: 100%; }

  /* ---- setup ---- */
  #setup { flex-direction: column; align-items: center; justify-content: center; padding: 28px; }
  #setup h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  #setup p { font-size: 14px; color: #5b6369; line-height: 1.6; margin: 0 0 18px; text-align: center; max-width: 460px; }
  #setup textarea {
    width: 100%; max-width: 520px; height: 120px; padding: 12px;
    font-size: 13px; font-family: ui-monospace, Menlo, monospace;
    border: 1px solid #cfd5d9; border-radius: 12px; resize: none; outline: none;
  }
  #setup textarea:focus { border-color: #06c755; }
  #setup-err { display: none; color: #d64541; font-size: 13px; margin: 10px 0 0; }
  #setup-go {
    margin-top: 16px; min-width: 200px; height: 52px; border: 0; border-radius: 12px;
    background: #06c755; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }

  /* ---- display ---- */
  #display { flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 3vmin; }
  #brand {
    font-size: 3.4vmin; font-weight: 700; letter-spacing: 0.01em;
    color: #14181c; margin-bottom: 2.4vmin; text-align: center; max-width: 92%;
  }
  #qr-wrap {
    background: #fff; padding: 3.2vmin; border-radius: 3vmin;
    box-shadow: 0 2vmin 6vmin rgba(6, 199, 85, 0.14);
  }
  #qr { width: 62vmin; height: 62vmin; }
  #qr svg { display: block; width: 100%; height: 100%; }
  #text-col { text-align: center; }
  #tagline { margin-top: 3.4vmin; font-size: 4.6vmin; font-weight: 800; color: #06a548; }
  #subline { margin-top: 1vmin; font-size: 2.6vmin; color: #5b6369; }

  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #eef1f2; }
  #bar-fill { height: 100%; width: 100%; background: #06c755; transition: width 0.9s linear; }

  #reconfig {
    position: absolute; top: 0; right: 0; width: 64px; height: 64px;
    border: 0; background: transparent; color: #c8ced2; font-size: 22px; cursor: pointer; opacity: 0.5;
  }

  /* A landscape tablet: QR left, message right. */
  @media (orientation: landscape) {
    #display { flex-direction: row; gap: 5vmin; }
    #brand { position: absolute; top: 4vmin; left: 0; right: 0; }
    #qr { width: 56vmin; height: 56vmin; }
    #text-col { text-align: left; }
    #tagline { margin-top: 0; font-size: 3.6vmin; white-space: nowrap; }
    #subline { margin-top: 2vmin; font-size: 2.2vmin; white-space: nowrap; }
  }
</style>
</head>
<body>

<div id="setup" class="screen">
  <h1>チェックイン表示の設定</h1>
  <p>
    管理画面 → キャンペーン → 「チェックイン表示」で表示される設定コードを貼り付けてください。
    一度設定すれば、この端末はオフラインでも動作します。<br>
    画面が消えないよう、iOS の「自動ロック」を「なし」にしておくことをおすすめします。
  </p>
  <textarea id="setup-input" autocapitalize="off" autocorrect="off" spellcheck="false"
    placeholder="設定コードをここに貼り付け"></textarea>
  <div id="setup-err">設定コードを読み取れませんでした。もう一度コピーしてお試しください。</div>
  <button id="setup-go" type="button">設定する</button>
</div>

<div id="display" class="screen">
  <button id="reconfig" type="button" aria-label="設定">&#9881;</button>
  <div id="brand"></div>
  <div id="qr-wrap"><div id="qr"></div></div>
  <div id="text-col">
    <div id="tagline">スキャンして来店ポイント</div>
    <div id="subline">1日1回スタンプがたまります</div>
  </div>
  <div id="bar"><div id="bar-fill"></div></div>
</div>

<script>
(function () {
  'use strict';

  var LS_KEY = 'checkin_display_cfg_v1';
  var cfg = null, lastWindow = -1, timer = null;

  function $(id) { return document.getElementById(id); }

  // base64url -> string. json.dumps is ascii-safe, so atob alone is enough,
  // but escape()/decodeURIComponent keeps it correct if that ever changes.
  function decodeBlob(str) {
    str = String(str).replace(/[\s]/g, '').replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) { str += '='; }
    var bin = atob(str);
    try { return decodeURIComponent(escape(bin)); } catch (e) { return bin; }
  }

  function loadCfg() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { return JSON.parse(raw); }
    } catch (e) {}
    return null;
  }

  function saveCfg(c) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(c)); } catch (e) {}
  }

  function applySetup() {
    var parsed = null;
    try { parsed = JSON.parse(decodeBlob($('setup-input').value)); } catch (e) {}
    if (!parsed || !parsed.t || !parsed.s) {
      $('setup-err').style.display = 'block';
      return;
    }
    cfg = {
      t: String(parsed.t),
      s: String(parsed.s),
      n: parsed.n ? String(parsed.n) : '',
      o: (parsed.o ? String(parsed.o) : '').replace(/\/+$/, ''),
      step: parseInt(parsed.step, 10) || 30
    };
    saveCfg(cfg);
    showDisplay();
  }

  function siteOrigin() {
    // The page is served from the customer-facing origin, so location.origin
    // is the trustworthy one. cfg.o only covers the file:// / null case.
    if (location.origin && location.origin.indexOf('http') === 0) { return location.origin; }
    if (cfg.o && cfg.o.indexOf('http') === 0) { return cfg.o; }
    return '';
  }

  function tick() {
    var now = Date.now() / 1000;
    var step = cfg.step || 30;
    var w = Math.floor(now / step);
    var frac = (now % step) / step;
    $('bar-fill').style.width = Math.round((1 - frac) * 100) + '%';
    if (w === lastWindow) { return; }
    lastWindow = w;

    var code = window.sha256(cfg.s + '.' + w).substring(0, 12);
    var url = siteOrigin() + '/pc/register?t=' + encodeURIComponent(cfg.t) + '&w=' + w + '&c=' + code;

    var qr = window.qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 3, scalable: true });
  }

  function showDisplay() {
    $('setup').style.display = 'none';
    $('display').style.display = 'flex';
    $('brand').textContent = cfg.n || '';
    lastWindow = -1;
    tick();
    if (timer) { clearInterval(timer); }
    timer = setInterval(tick, 1000);
  }

  function showSetup() {
    if (timer) { clearInterval(timer); timer = null; }
    $('display').style.display = 'none';
    $('setup').style.display = 'flex';
    $('setup-err').style.display = 'none';
  }

  $('setup-go').addEventListener('click', applySetup);
  $('reconfig').addEventListener('click', function () {
    if (window.confirm('設定を変更しますか？')) { showSetup(); }
  });
  // The screen staying on is an OS setting, not something JS can do on iOS:
  // 設定 → 画面表示と明るさ → 自動ロック → なし（またはガイドアクセス）.

  cfg = loadCfg();
  if (cfg && cfg.t && cfg.s) { showDisplay(); } else { showSetup(); }
})();
</script>
